# Loom — Ollama service tuning for hosting a live game server.
# Install (needs sudo):
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp ops/ollama.service.d/override.conf \
#           /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
# Verify:  systemctl show ollama -p Environment | tr ' ' '\n' | grep OLLAMA_

[Service]
# Concurrent requests per model — lets several NPCs answer at once.
Environment="OLLAMA_NUM_PARALLEL=4"

# DEFAULT context for requests that don't specify — i.e. the fast NPC turns.
# It is a default, NOT a ceiling: a per-role model variant can bake a larger
# num_ctx and override this upward (see ops/modelfiles/loom-gm.Modelfile for the
# game-master). Keep this small so NPC KV-cache stays cheap and parallelism high.
# (Ollama's OpenAI /v1 endpoint ignores per-request num_ctx, hence the variant.)
Environment="OLLAMA_CONTEXT_LENGTH=8192"

# Keep the fast NPC model and the quality/GM model resident together (one per card).
Environment="OLLAMA_MAX_LOADED_MODELS=2"

# Keep models hot indefinitely — no cold reloads mid-session. Set e.g. "30m"
# instead to free VRAM after idle.
Environment="OLLAMA_KEEP_ALIVE=-1"

# Flash attention: faster and smaller KV cache on Ada.
Environment="OLLAMA_FLASH_ATTENTION=1"
